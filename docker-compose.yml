services:
  postgres:
    image: postgres:17-alpine
    container_name: coderoom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coderoom
      POSTGRES_PASSWORD: coderoom_dev_password
      POSTGRES_DB: coderoom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coderoom -d coderoom"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: coderoom-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  piston:
    image: ghcr.io/engineer-man/piston
    container_name: coderoom-piston
    restart: unless-stopped
    privileged: true
    ports:
      - "2000:2000"
    volumes:
      - piston_packages:/piston/packages
    tmpfs:
      - /tmp:exec
    # Workaround: one GitHub download server is unreachable on this network,
    # so point GitHub's download sites to a server that works.
    extra_hosts:
      - "release-assets.githubusercontent.com:185.199.108.133"
      - "objects.githubusercontent.com:185.199.108.133"

volumes:
  postgres_data:
  redis_data:
  piston_packages: