services:
  postgres:
    image: postgres:17-alpine
    container_name: coderoom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coderoom
      POSTGRES_PASSWORD: coderoom_dev_password
      POSTGRES_DB: coderoom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coderoom -d coderoom"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: coderoom-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
